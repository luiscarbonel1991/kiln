# Local infra for Kiln. Isolated by container + volume name so it never collides
# with the user's other local stacks. Host ports avoid taken ones (5432/5433/55432
# Postgres, 4566 LocalStack, etc.). S3 is MinIO (free, tokenless, S3-compatible) —
# the storage adapter is the same @aws-sdk/client-s3 regardless of backend.
services:
  db:
    image: postgres:17
    container_name: kiln-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln
      POSTGRES_DB: kiln
    ports:
      - "5444:5432"
    volumes:
      - kiln-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: minio/minio:latest
    container_name: kiln-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kiln
      MINIO_ROOT_PASSWORD: kiln-secret-key
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - kiln-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kiln itself (docker compose --profile app up -d --build). Off by default,
  # so `pnpm db:up` still starts only the database and storage for `pnpm dev`.
  # Without keys it runs on mock providers: nothing is paid, nothing is sent.
  # Keys and settings come from .env when there is one.
  app:
    profiles: ["app"]
    build: .
    container_name: kiln-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://kiln:kiln@db:5432/kiln?schema=public
      KILN_MOCK_DATABASE_URL: postgresql://kiln:kiln@db:5432/kiln_mock?schema=public
      KILN_PROVIDERS: ${KILN_PROVIDERS:-mock}
      STORAGE_PROVIDER: s3
      # The server reaches storage inside the network; browsers on the host.
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: kiln-assets
      S3_ACCESS_KEY_ID: kiln
      S3_SECRET_ACCESS_KEY: kiln-secret-key
      KILN_OCR: tesseract
    ports:
      - "${KILN_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  kiln-pgdata:
    name: kiln-pgdata
  kiln-minio:
    name: kiln-minio

name: Public page

# The public page as static files on GitHub Pages. Run by hand (Actions →
# Public page → Run workflow), never on a push: publishing is a decision.
# Before the first run, Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export the page
    runs-on: ubuntu-latest
    container: node:26-trixie-slim
    timeout-minutes: 15
    # The page reads no database, but `prisma generate` (on install) and the
    # build want an address; nothing connects to it.
    env:
      DATABASE_URL: postgresql://kiln:kiln@localhost:5432/kiln
    steps:
      - name: System tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm, at the version packageManager names
        run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: pnpm install --frozen-lockfile
      # Served under the repository's name; "Get started" leads to the repository.
      - run: >-
          pnpm site:export
          --base "/${{ github.event.repository.name }}"
          --start "https://github.com/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

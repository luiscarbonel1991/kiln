name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests and builds
    runs-on: ubuntu-latest
    # The Dockerfile's base: Debian 13 packages ImageMagick 7 (`magick`), which
    # the image tests call; Ubuntu's runners only package ImageMagick 6.
    container: node:26-trixie-slim
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln
          POSTGRES_DB: kiln_test
        options: >-
          --health-cmd "pg_isready -U kiln -d kiln_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kiln:kiln@postgres:5432/kiln_test
      KILN_DB_TESTS: "1"
    steps:
      - name: System tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git imagemagick ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm, at the version packageManager names
        run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm engine:build
      - run: pnpm cli:build

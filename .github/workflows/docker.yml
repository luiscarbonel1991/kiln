name: Docker image

# The image builds wherever its inputs change, a base image bump included: a
# Dockerfile that no longer builds fails here, before it reaches main.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - scripts/docker-start.sh
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - scripts/docker-start.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t kiln:ci .
      - name: The tools Kiln shells out to
        run: >-
          docker run --rm kiln:ci sh -c
          "node --version && pnpm --version && magick -version | head -1
          && tesseract --version | head -1 && ffmpeg -version | head -1"

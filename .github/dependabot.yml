version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types follow the oldest Node Kiln supports (engines), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) has no JavaScript API yet, which
      # agent-ready.test.ts reads TSX with.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
